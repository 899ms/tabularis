name: Packages

# Tests, builds and checks the workspace packages under packages/*. Each
# package owns its vitest (node environment); the root vitest (jsdom) only
# covers the host app. Runs only when a package, or a host file a package
# imports, changes.

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'src/pluginApi.ts' # plugin-api check:sync
      - 'src/schemas/theme*' # imported by create-plugin
      - 'src/types/theme*'
      - 'src/utils/theme*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'src/pluginApi.ts'
      - 'src/schemas/theme*'
      - 'src/types/theme*'
      - 'src/utils/theme*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: '@tabularis/plugin-api'
            steps: build check:sync
          - name: '@tabularis/explain'
            steps: typecheck test build
          - name: '@tabularis/create-plugin'
            steps: test build smoke smoke:theme
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # create-plugin's smoke scaffolds a Rust driver and runs `cargo check`.
      - name: Setup Rust
        if: matrix.package.name == '@tabularis/create-plugin'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in ${{ matrix.package.steps }}; do
            echo "::group::pnpm --filter ${{ matrix.package.name }} $script"
            pnpm --filter '${{ matrix.package.name }}' "$script"
            echo "::endgroup::"
          done
